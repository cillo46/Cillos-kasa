<style>

:root{
  --bg:#f2f3f5; --ink:#12161c; --mute:#6a7482; --line:#e6e9ed; --surface:#fff;
  --card:#2f6bff; --cash:#12a06a; --out:#e5484d;
  --tint-card:#e8efff; --tint-cash:#e0f5ec; --tint-out:#fde8e9;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0e1116; --ink:#f1f3f6; --mute:#8d97a5; --line:#262c35; --surface:#171b22;
    --card:#6b95ff; --cash:#3ccf94; --out:#ff7a7f;
    --tint-card:#1d2740; --tint-cash:#15302a; --tint-out:#3a1f22;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;max-width:560px;margin:0 auto;padding:14px 16px 160px;font-variant-numeric:tabular-nums}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.top img{height:38px;width:auto;max-width:55%;background:#fff;border-radius:12px;padding:6px 12px;display:block}
.acts{display:flex;gap:8px}
.acts button{background:var(--surface);border:0;color:var(--ink);font:inherit;font-size:14px;font-weight:600;border-radius:999px;padding:0 14px;min-height:40px}
.daybar{display:flex;align-items:center;justify-content:space-between;background:var(--surface);border-radius:22px;padding:6px;margin-bottom:12px}
.daybar>button{width:50px;height:50px;border:0;border-radius:16px;background:var(--bg);color:var(--ink);font-size:26px;line-height:1}
.daybar .mid{display:flex;flex-direction:column;align-items:center}
.daybar input[type=date]{font:inherit;font-size:19px;font-weight:700;text-align:center;border:0;background:transparent;color:var(--ink);padding:0 4px;min-height:30px}
.daybar .row2{display:flex;align-items:center;gap:8px;min-height:24px}
.daybar .dow{color:var(--mute);font-size:13px}
.daybar .lnk{border:0;background:var(--tint-card);color:var(--card);font:inherit;font-size:12px;font-weight:700;border-radius:999px;padding:3px 10px}
.sum{background:var(--ink);color:var(--bg);border-radius:26px;padding:18px 18px 14px;margin-bottom:16px}
.sum .lbl{font-size:13px;opacity:.7}
.sum .big{font-size:38px;font-weight:800;letter-spacing:-.5px;line-height:1.15;margin:2px 0 14px}
.sum .big small{font-size:16px;font-weight:600;opacity:.7;margin-right:6px;letter-spacing:0}
.sum .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;border-top:1px solid rgba(128,128,128,.35);padding-top:12px}
.sum .stats div{display:flex;flex-direction:column;gap:2px}
.sum .stats span{font-size:12px;opacity:.7;display:flex;align-items:center;gap:6px}
.sum .stats i{width:8px;height:8px;border-radius:50%;display:inline-block}
.sum .stats b{font-size:16px;font-weight:700}
.sum.neg .big{color:var(--out)}
.btns{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:560px;z-index:3;display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:14px 16px calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--bg) 72%,transparent)}
.btns button{border:0;border-radius:22px;color:#fff;min-height:86px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font:inherit}
.btns button b{font-size:32px;line-height:1;font-weight:500}
.btns button span{font-size:14px;font-weight:700}
.b-card{background:#2f5fe8}.b-cash{background:#0f8a5a}.b-out{background:#d93a40}
.list{background:var(--surface);border-radius:22px;overflow:hidden}
.item{display:flex;align-items:center;gap:12px;background:transparent;padding:12px 14px;width:100%;border:0;border-bottom:1px solid var(--line);color:var(--ink);font:inherit;text-align:left}
.item:last-child{border-bottom:0}
.ic{width:40px;height:40px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;flex:none}
.ic.in-card{background:var(--tint-card);color:var(--card)}
.ic.in-cash{background:var(--tint-cash);color:var(--cash)}
.ic.out{background:var(--tint-out);color:var(--out)}
.tx{flex:1;min-width:0;display:flex;flex-direction:column}
.item .t{font-weight:600}
.item .n{color:var(--mute);font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.amt{font-weight:700;white-space:nowrap}
.amt.in-card{color:var(--card)}.amt.in-cash{color:var(--cash)}.amt.out{color:var(--out)}
.empty{color:var(--mute);text-align:center;padding:28px 12px;background:var(--surface);border-radius:22px;margin:0}
.hint{color:var(--mute);font-size:12px;text-align:center;margin:10px 0 0}
.del{border:0;background:var(--tint-out);color:var(--out);border-radius:12px;min-width:48px;min-height:44px;font:inherit;font-size:13px;font-weight:700;padding:0 12px;flex:none}
.del.ask{background:var(--out);color:#fff}
.lock{position:fixed;inset:0;z-index:50;background:var(--bg);display:none;flex-direction:column;align-items:center;justify-content:center;padding:24px;gap:16px}
.lock.on{display:flex}
.lock img{height:44px;width:auto;background:#fff;border-radius:12px;padding:6px 12px}
.lock h2{margin:0;font-size:20px;color:var(--ink)}
.lock .dots{display:flex;gap:12px;height:18px}
.lock .dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--mute)}
.lock .dots i.f{background:var(--ink);border-color:var(--ink)}
.lock .msg{min-height:20px;color:var(--out);font-size:14px;margin:0;text-align:center}
.pad{display:grid;grid-template-columns:repeat(3,78px);gap:14px}
.pad button{height:78px;border-radius:50%;border:0;background:var(--surface);color:var(--ink);font:inherit;font-size:28px;font-weight:600}
.pad button.sp{background:transparent;font-size:22px;color:var(--mute)}
@media print{.lock{display:none!important}}
.role-entry #pdf,.role-entry #csv,.role-entry .del,.role-entry #reset,.role-entry .daybar,.role-entry #sum,.role-entry label[for=date],.role-entry #date{display:none!important}
.bk{display:none;align-items:center;justify-content:space-between;gap:10px;background:var(--tint-out);color:var(--out);border-radius:18px;padding:10px 14px;margin-bottom:12px;font-weight:600;font-size:14px}
.bk button{border:0;background:var(--out);color:#fff;border-radius:999px;min-height:36px;padding:0 14px;font:inherit;font-weight:700;flex:none}
.role-entry .bk{display:none!important}
.snaps{margin-top:14px}
.snaps h4{margin:0 0 6px;font-size:14px;color:var(--mute)}
.snap{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.snap button{border:0;background:var(--tint-card);color:var(--card);border-radius:12px;min-height:40px;padding:0 12px;font:inherit;font-weight:700;flex:none}
.snap button.ask{background:var(--card);color:#fff}
.rtxt{color:var(--mute);font-size:14px;margin:0 0 4px}
.rbtn{width:100%;min-height:56px;border:0;border-radius:16px;background:var(--tint-out);color:var(--out);font:inherit;font-size:16px;font-weight:700;margin-top:10px}
.rbtn.ask{background:var(--out);color:#fff}
.rbtn:disabled{opacity:.45}
.resetlink{display:block;margin:18px auto 0;background:none;border:0;color:var(--mute);font:inherit;font-size:14px;text-decoration:underline;min-height:44px}
.sum .tot2{border-top:1px solid rgba(128,128,128,.35);margin-top:12px;padding-top:10px}
.sum .tot2 div{display:flex;justify-content:space-between;align-items:baseline;padding:3px 0}
.sum .tot2 span{font-size:14px;opacity:.85}
.sum .tot2 em{font-style:normal;font-size:12px;opacity:.6;margin-left:4px}
.sum .tot2 b{font-size:17px}
/* sheet */
.veil{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:5}
.veil.open{display:flex}
.sheet{background:var(--surface);width:100%;max-width:560px;border-radius:26px 26px 0 0;padding:20px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.sheet h3{margin:0 0 12px;font-size:18px}
.sheet label{display:block;color:var(--mute);font-size:14px;margin:10px 0 4px}
.sheet input{width:100%;font:inherit;font-size:18px;padding:12px;border:0;border-radius:14px;background:var(--bg);color:var(--ink)}
.sheet input#amt{font-size:28px;font-weight:700}
.sheet .go{display:flex;gap:10px;margin-top:16px}
.sheet .go button{flex:1;min-height:56px;border-radius:16px;border:0;font:inherit;font-size:17px;font-weight:700}
.sheet .cancel{background:var(--bg);color:var(--ink)}
.sheet .save{color:#fff}
button:focus-visible,input:focus-visible{outline:3px solid #7aa7ff;outline-offset:2px}
.report{display:none;position:fixed;inset:0;background:#fff;color:#111;z-index:9;overflow:auto;padding:calc(16px + env(safe-area-inset-top,0px)) 16px 40px}
.report.open{display:block}
.report .bar{display:flex;gap:10px;margin-bottom:14px}
.report .bar button{flex:1;min-height:48px;border-radius:10px;border:0;font:inherit;font-weight:700;background:#1f5fbf;color:#fff}
.report .bar .x{background:#e6e9ee;color:#111}
.report .bar .on{background:#1b2430;color:#fff}
.report .bar{gap:6px}
.report .bar button{font-size:14px;padding:0 4px}
.report h2.rt{font-size:18px;color:#111;margin:8px 0 4px}
.report p.sub{margin:0 0 12px;color:#444;font-size:13px}
.report .tw{overflow-x:auto}
.report table{width:100%;border-collapse:collapse;font-size:12.5px;margin-bottom:14px}
.report th,.report td{border:1px solid #b5b9bf;padding:6px;text-align:right;white-space:nowrap}
.report th:first-child,.report td:first-child{text-align:left}
.report th{background:#eef0f3}
.report tr.tot td{font-weight:700;background:#f6f6f6}
.report .ent th:last-child,.report .ent td:last-child{text-align:left;white-space:normal;min-width:130px}

@page{size:A4 portrait;margin:12mm}
@media print{
html,body{background:#fff!important;margin:0!important;padding:0!important;max-width:none!important}
body>*:not(.report){display:none!important}
.report{display:block!important;position:static;padding:0;overflow:visible;font-size:10pt;color:#000;background:#fff}
.report .bar{display:none}
.report .tw{overflow:visible}
.report h2.rt{font-size:14pt;margin:0 0 2mm;color:#000;break-after:avoid}
.report p.sub{font-size:9pt;margin:0 0 3mm;color:#333}
.report table{width:100%;font-size:9pt;margin-bottom:5mm}
.report th,.report td{padding:1.6mm 1.8mm;border:0.3mm solid #777;white-space:nowrap}
.report thead{display:table-header-group}
.report tr{break-inside:avoid;page-break-inside:avoid}
.report .ent th:last-child,.report .ent td:last-child{min-width:0;width:34%;white-space:normal}
.report th{background:#e8eaee!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.report tr.tot td{background:#f0f0f0!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>

<script>
const LABELS = {
  'gelir-card': {name:'Gelir Card', cls:'in-card', sign:1, color:'#2f5fe8'},
  'gelir-cash': {name:'Gelir Cash', cls:'in-cash', sign:1, color:'#0f8a5a'},
  'gider-cash': {name:'Gider Cash', cls:'out', sign:-1, color:'#d93a40'}
};
const KEY = 'cillos-muhasebe-v1';
let entries = [];
try { entries = JSON.parse(localStorage.getItem(KEY) || '[]'); } catch (e) { entries = []; }
function persist(){ try { localStorage.setItem(KEY, JSON.stringify(entries)); } catch (e) {} }

const pad = n => String(n).padStart(2,'0');
const ymd = d => d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate());
const chf = n => n.toLocaleString('de-CH', {minimumFractionDigits:2, maximumFractionDigits:2});
const MONTHS = ['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];

let day = ymd(new Date());
const DOW = ['Pazar','Pazartesi','Salı','Çarşamba','Perşembe','Cuma','Cumartesi'];
let currentType = null;
function shiftDay(n){ const d = new Date(day + 'T00:00:00'); d.setDate(d.getDate() + n); day = ymd(d); render(); }

const SKEY = 'cillos-snaps-v1';
function loadSnaps(){ try { return JSON.parse(localStorage.getItem(SKEY) || '[]'); } catch (e) { return []; } }
function saveSnaps(a){ try { localStorage.setItem(SKEY, JSON.stringify(a.slice(-30))); } catch (e) {} }
function snapshotNow(label, key){ const a = loadSnaps(); a.push({k: key || ('m' + Date.now()), d: ymd(new Date()), t: Date.now(), l: label, e: JSON.parse(JSON.stringify(entries))}); saveSnaps(a); }
function checkBackup(){
  if (!entries.length) return;
  const n = new Date();
  const after = n.getHours() * 60 + n.getMinutes() >= 19 * 60 + 7;
  const due = new Date(n); if (!after) due.setDate(due.getDate() - 1);
  const key = 'auto-' + ymd(due);
  if (loadSnaps().some(x => x.k === key)) return;
  snapshotNow('Otomatik', key);
}
function render(){
  checkBackup();
  const dd = new Date(day + 'T00:00:00');
  document.getElementById('jump').value = day;
  document.getElementById('dow').textContent = DOW[dd.getDay()];
  document.getElementById('today').style.display = day === ymd(new Date()) ? 'none' : '';
  const list = entries.filter(e => e.date === day).sort((a,b) => b.ts - a.ts);
  const sum = t => list.filter(e => e.type === t).reduce((s,e) => s + e.amount, 0);
  const card = sum('gelir-card'), cash = sum('gelir-cash'), out = sum('gider-cash');
  const sumEl = document.getElementById('sum');
  sumEl.className = 'sum' + (cash - out < 0 ? ' neg' : '');
  sumEl.innerHTML =
    '<div class="lbl">Cash kalan</div>' +
    '<div class="big"><small>CHF</small>' + chf(cash - out) + '</div>' +
    '<div class="stats">' +
    '<div><span><i style="background:var(--card)"></i>Card</span><b>' + chf(card) + '</b></div>' +
    '<div><span><i style="background:var(--cash)"></i>Cash</span><b>' + chf(cash) + '</b></div>' +
    '<div><span><i style="background:var(--out)"></i>Gider</span><b>' + (out ? '−' : '') + chf(out) + '</b></div>' +
    '</div>' +
    '<div class="tot2">' +
    '<div><span>Toplam kazanç <em>Card + Cash</em></span><b>CHF ' + chf(card + cash) + '</b></div>' +
    '<div><span>Toplam gider <em>Gider Cash</em></span><b>' + (out ? '−' : '') + 'CHF ' + chf(out) + '</b></div>' +
    '</div>';

  const box = document.getElementById('list');
  if (!list.length) { box.innerHTML = '<p class="empty">Bu gün kayıt yok. Aşağıdaki düğmelerden ekle.</p>'; return; }
  let html = '<div class="list">';
  list.forEach(e => {
    const L = LABELS[e.type];
    const note = e.note ? '<div class="n">' + esc(e.note) + '</div>' : '';
    html += '<div class="item"><span class="ic ' + L.cls + '">' + (L.sign < 0 ? '−' : '+') + '</span>' +
            '<span class="tx"><span class="t">' + L.name + '</span>' + note + '</span>' +
            '<span class="amt ' + L.cls + '">' + (L.sign < 0 ? '−' : '+') + chf(e.amount) + '</span>' +
            '<button class="del" data-id="' + e.id + '" aria-label="Kaydı sil">Sil</button></div>';
  });
  box.innerHTML = html + '</div>';
}
function esc(s){ return s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

const veil = document.getElementById('veil');
function openSheet(type){
  currentType = type;
  const L = LABELS[type];
  document.getElementById('stitle').textContent = L.name;
  document.getElementById('save').style.background = L.color;
  document.getElementById('amt').value = '';
  document.getElementById('note').value = '';
  document.getElementById('date').value = day;
  veil.classList.add('open');
  setTimeout(() => document.getElementById('amt').focus(), 50);
}
function closeSheet(){ veil.classList.remove('open'); }

document.querySelectorAll('.btns button').forEach(b => b.addEventListener('click', () => openSheet(b.dataset.type)));
document.getElementById('cancel').addEventListener('click', closeSheet);
veil.addEventListener('click', e => { if (e.target === veil) closeSheet(); });

document.getElementById('save').addEventListener('click', () => {
  const raw = document.getElementById('amt').value.replace(',', '.').trim();
  const amount = parseFloat(raw);
  if (!(amount > 0)) { document.getElementById('amt').focus(); return; }
  const date = document.body.classList.contains('role-entry') ? ymd(new Date()) : (document.getElementById('date').value || ymd(new Date()));
  entries.push({
    id: Date.now().toString(36) + Math.random().toString(36).slice(2,6),
    type: currentType,
    amount: Math.round(amount * 100) / 100,
    note: document.getElementById('note').value.trim(),
    date: date,
    ts: Date.now()
  });
  persist();
  closeSheet();
  day = date;
  render();
});

document.getElementById('list').addEventListener('click', e => {
  if (document.body.classList.contains('role-entry')) return;
  const b = e.target.closest('.del'); if (!b) return;
  const en = entries.find(x => x.id === b.dataset.id); if (!en) return;
  if (b.dataset.ask === '1') {
    entries = entries.filter(x => x.id !== en.id); persist(); render();
    return;
  }
  document.querySelectorAll('.del').forEach(x => { x.dataset.ask = ''; x.classList.remove('ask'); x.textContent = 'Sil'; });
  b.dataset.ask = '1'; b.classList.add('ask'); b.textContent = 'Emin misin?';
  setTimeout(() => { if (b.isConnected) { b.dataset.ask = ''; b.classList.remove('ask'); b.textContent = 'Sil'; } }, 3500);
});

document.getElementById('prev').addEventListener('click', () => shiftDay(-1));
document.getElementById('next').addEventListener('click', () => shiftDay(1));
document.getElementById('today').addEventListener('click', () => { day = ymd(new Date()); render(); });
document.getElementById('jump').addEventListener('change', e => { if (e.target.value) { day = e.target.value; render(); } });

document.getElementById('csv').addEventListener('click', () => {
  if (document.body.classList.contains('role-entry')) return;
  const rows = [['Tarih','Tür','Tutar CHF','Not']].concat(
    entries.slice().sort((a,b) => a.date.localeCompare(b.date) || a.ts - b.ts)
      .map(e => [e.date, LABELS[e.type].name, e.amount.toFixed(2), '"' + e.note.replace(/"/g,'""') + '"']));
  const blob = new Blob(['\ufeff' + rows.map(r => r.join(';')).join('\n')], {type:'text/csv'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = 'muhasebe-yedek.csv';
  document.body.appendChild(a); a.click(); a.remove();
});

const pctTxt = (a,b) => b > 0 ? (a/b*100).toFixed(1).replace('.', ',') + ' %' : '–';
const dmy = d => { const p = d.split('-'); return p[2] + '.' + p[1] + '.' + p[0]; };
function mm(a){ if(!a.length) return ['–','–']; const v = a.map(e => e.amount); return [chf(Math.min.apply(null,v)), chf(Math.max.apply(null,v))]; }
const rep = document.getElementById('report');
function openReport(mode){
  if (document.body.classList.contains('role-entry')) return;
  mode = (mode === 'month' || mode === 'year') ? mode : 'day';
  const ym = day.slice(0,7), yy = day.slice(0,4);
  const list = entries.filter(e => mode === 'year' ? e.date.startsWith(yy) : mode === 'month' ? e.date.startsWith(ym) : e.date === day).sort((a,b) => a.date.localeCompare(b.date) || a.ts - b.ts);
  const by = t => list.filter(e => e.type === t);
  const card = by('gelir-card'), cash = by('gelir-cash'), out = by('gider-cash');
  const tot = a => a.reduce((s,e) => s + e.amount, 0);
  const sc = tot(card), sh = tot(cash), so = tot(out), inc = sc + sh;
  const incAll = card.concat(cash);
  const row = (name, a, sum, p, cls) => { const m = mm(a); return '<tr' + (cls ? ' class="' + cls + '"' : '') + '><td>' + name + '</td><td>' + a.length + '</td><td>' + sum + '</td><td>' + p + '</td><td>' + m[0] + '</td><td>' + m[1] + '</td></tr>'; };
  const rows =
    row('Gelir Card', card, chf(sc), pctTxt(sc, inc)) +
    row('Gelir Cash', cash, chf(sh), pctTxt(sh, inc)) +
    row('Toplam kazanç', incAll, chf(inc), inc > 0 ? '100,0 %' : '–', 'tot') +
    row('Gider Cash', out, '−' + chf(so), pctTxt(so, sh)) +
    '<tr class="tot"><td>Cash kalan</td><td></td><td>' + chf(sh - so) + '</td><td>' + pctTxt(sh - so, sh) + '</td><td>–</td><td>–</td></tr>';
  const days = {};
  incAll.forEach(e => { days[e.date] = (days[e.date] || 0) + e.amount; });
  const dk = Object.keys(days).sort((a,b) => days[a] - days[b]);
  let dayTxt = '';
  if (mode !== 'day' && dk.length) {
    const hi = dk[dk.length-1], lo = dk[0];
    dayTxt = '<p class="sub">En çok gelir günü: <b>' + dmy(hi) + ' – CHF ' + chf(days[hi]) + '</b><br>En az gelir günü: <b>' + dmy(lo) + ' – CHF ' + chf(days[lo]) + '</b></p>';
  }
  if (mode === 'year') {
    const mt = {}; incAll.forEach(e => { const k = e.date.slice(0,7); mt[k] = (mt[k] || 0) + e.amount; });
    const mk = Object.keys(mt).sort((a,b) => mt[a] - mt[b]);
    if (mk.length) { const mh = mk[mk.length-1], ml = mk[0];
      dayTxt += '<p class="sub">En çok gelir ayı: <b>' + MONTHS[+mh.slice(5)-1] + ' – CHF ' + chf(mt[mh]) + '</b><br>En az gelir ayı: <b>' + MONTHS[+ml.slice(5)-1] + ' – CHF ' + chf(mt[ml]) + '</b></p>'; }
  }
  const byDay = {};
  list.forEach(e => { const kk = mode === 'year' ? e.date.slice(0,7) : e.date; const r = byDay[kk] || (byDay[kk] = {c:0,h:0,o:0,n:[]}); if (e.type === 'gelir-card') r.c += e.amount; else if (e.type === 'gelir-cash') r.h += e.amount; else { r.o += e.amount; r.n.push((e.note || 'Gider') + ' ' + chf(e.amount)); } });
  const dkeys = Object.keys(byDay).sort();
  const dash = v => v ? chf(v) : '–';
  const drow = (label, r, cls) => '<tr' + (cls ? ' class="' + cls + '"' : '') + '><td>' + label + '</td><td>' + dash(r.c) + '</td><td>' + dash(r.h) + '</td><td>' + (r.o ? '−' + chf(r.o) : '–') + '</td><td>' + chf(r.h - r.o) + '</td><td>' + (r.n && r.n.length ? (mode === 'year' ? r.n.length + ' kalem' : esc(r.n.join('; '))) : '–') + '</td></tr>';
  const sumAll = {c: sc, h: sh, o: so};
  const ent = dkeys.map(k => drow(mode === 'year' ? MONTHS[+k.slice(5)-1] : dmy(k), byDay[k])).join('') + (dkeys.length > 1 ? drow('Toplam', sumAll, 'tot') : '') || '<tr><td colspan="6">Kayıt yok</td></tr>';
  rep.innerHTML =
    '<div class="bar"><button id="rpdf">PDF kaydet</button><button class="' + (mode === 'day' ? 'on' : 'x') + '" id="rday">Gün</button><button class="' + (mode === 'month' ? 'on' : 'x') + '" id="rmonth">Ay</button><button class="' + (mode === 'year' ? 'on' : 'x') + '" id="ryear">Yıl</button><button class="x" id="rx">Kapat</button></div>' +
    '<h2 class="rt">Cillo’s – ' + (mode === 'year' ? 'Yıllık rapor' : mode === 'month' ? 'Aylık rapor' : 'Günlük rapor') + '</h2><p class="sub">' + (mode === 'year' ? yy : mode === 'month' ? MONTHS[+ym.slice(5) - 1] + ' ' + ym.slice(0,4) : dmy(day) + ' · ' + DOW[new Date(day + 'T00:00:00').getDay()]) + ' · Tutarlar CHF</p>' +
    '<div class="tw"><table><thead><tr><th>Tür</th><th>Adet</th><th>Toplam</th><th>Oran</th><th>En az</th><th>En çok</th></tr></thead><tbody>' + rows + '</tbody></table></div>' +
    dayTxt +
    '<p class="sub">Oran: Card ve Cash, toplam gelirdeki payı. Gider ve Cash kalan, Cash gelirine oranı. En az / En çok: tek kayıtların en küçük ve en büyük tutarı.</p>' +
    '<h2 class="rt">' + (mode === 'year' ? 'Aylık kayıtlar' : 'Günlük kayıtlar') + '</h2><div class="tw"><table class="ent"><thead><tr><th>' + (mode === 'year' ? 'Ay' : 'Tarih') + '</th><th>Gelir Card</th><th>Gelir Cash</th><th>Gider Cash</th><th>Cash kalan</th><th>' + (mode === 'year' ? 'Gider adedi' : 'Gider açıklaması') + '</th></tr></thead><tbody>' + ent + '</tbody></table></div>';
  rep.classList.add('open');
  rep.scrollTop = 0;
}
rep.addEventListener('click', e => {
  if (e.target.id === 'rpdf') window.print();
  if (e.target.id === 'rday') openReport('day');
  if (e.target.id === 'rmonth') openReport('month');
  if (e.target.id === 'ryear') openReport('year');
  if (e.target.id === 'rx') rep.classList.remove('open');
});
document.getElementById('pdf').addEventListener('click', () => openReport('day'));

const rveil = document.getElementById('rveil');
const rsm = document.getElementById('rsm'), rsy = document.getElementById('rsy');
function resetLabels(){
  const ym = day.slice(0,7), y = day.slice(0,4);
  const nm = entries.filter(e => e.date.startsWith(ym)).length, ny = entries.filter(e => e.date.startsWith(y)).length;
  rsm.dataset.pre = ym; rsm.dataset.n = nm; rsm.dataset.ask = '';
  rsy.dataset.pre = y; rsy.dataset.n = ny; rsy.dataset.ask = '';
  rsm.className = 'rbtn'; rsy.className = 'rbtn';
  rsm.textContent = 'Aylık: ' + MONTHS[+ym.slice(5) - 1] + ' ' + y + ' (' + nm + ' kayıt)';
  rsy.textContent = 'Yıllık: ' + y + ' (' + ny + ' kayıt)';
  rsm.disabled = !nm; rsy.disabled = !ny;
  renderSnaps();
}
document.getElementById('reset').addEventListener('click', () => { if (document.body.classList.contains('role-entry')) return; resetLabels(); rveil.classList.add('open'); });
function renderSnaps(){
  const a = loadSnaps().slice().reverse().slice(0, 6), el = document.getElementById('snaps');
  if (!a.length) { el.innerHTML = '<h4>Otomatik yedekler</h4><p class="rtxt">Henüz yedek yok. Her gün 19:07\'den sonra, uygulama açıkken otomatik alınır.</p>'; return; }
  el.innerHTML = '<h4>Otomatik yedekler (son ' + a.length + ')</h4>' + a.map(x => '<div class="snap"><span>' + dmy(x.d) + ' ' + new Date(x.t).toLocaleTimeString('de-CH', {hour:'2-digit', minute:'2-digit'}) + ' · ' + esc(x.l) + ' · ' + x.e.length + ' kayıt</span><button data-k="' + x.k + '">Geri yükle</button></div>').join('');
}
document.getElementById('snaps').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  const k = b.dataset.k;
  if (b.dataset.ask === '1') {
    const x = loadSnaps().find(z => z.k === k); if (!x) return;
    snapshotNow('Geri yüklemeden önce');
    entries = JSON.parse(JSON.stringify(x.e)); persist(); rveil.classList.remove('open'); render(); return;
  }
  renderSnaps();
  document.querySelectorAll('#snaps button').forEach(nb => { if (nb.dataset.k === k) { nb.dataset.ask = '1'; nb.className = 'ask'; nb.textContent = 'Emin misin?'; } });
});
document.getElementById('rcancel').addEventListener('click', () => rveil.classList.remove('open'));
rveil.addEventListener('click', e => { if (e.target === rveil) rveil.classList.remove('open'); });
[rsm, rsy].forEach(b => b.addEventListener('click', () => {
  if (b.dataset.ask === '1') {
    snapshotNow('Sıfırlama öncesi');
    entries = entries.filter(e => !e.date.startsWith(b.dataset.pre));
    persist(); rveil.classList.remove('open'); render(); return;
  }
  resetLabels();
  b.dataset.ask = '1'; b.className = 'rbtn ask';
  b.textContent = 'Emin misin? ' + b.dataset.n + ' kayıt silinecek';
}));

const PINS = [{n:'Ben', h:'09f2b75a0be8a1c526199f2658ee93a9e206c93e4a3ad44ba39cf7a07ef882ae', r:'admin'}, {n:'Giriş', h:'a3d00e60a311f4579d0acd0755cdc271a0770595fa2ac2b52db41e51f9a21aa4', r:'entry'}];
const SALT = 'cillos-kasa-v1:', PLEN = 4;
const lockEl = document.getElementById('lock');
document.getElementById('limg').src = document.querySelector('.top img').src;
let buf = '', fails = 0, until = 0, hid = 0;
const dotsEl = document.getElementById('dots'), lmsg = document.getElementById('lmsg');
function drawDots(){ let h = ''; for (let i = 0; i < PLEN; i++) h += '<i class="' + (i < buf.length ? 'f' : '') + '"></i>'; dotsEl.innerHTML = h; }
async function sha(t){ try { const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(SALT + t)); return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2,'0')).join(''); } catch (e) { return ''; } }
function applyRole(r){ document.body.classList.toggle('role-entry', r !== 'admin'); if (r !== 'admin') { day = ymd(new Date()); render(); } }
function unlock(r){ r = r || 'entry'; try { sessionStorage.setItem('cm-ok','1'); sessionStorage.setItem('cm-role', r); } catch (e) {} applyRole(r); lockEl.classList.remove('on'); buf = ''; drawDots(); lmsg.textContent = ''; }
function lockNow(){ try { sessionStorage.removeItem('cm-ok'); } catch (e) {} buf = ''; drawDots(); lmsg.textContent = ''; lockEl.classList.add('on'); }
async function press(k){
  if (Date.now() < until) { lmsg.textContent = 'Çok fazla deneme. ' + Math.ceil((until - Date.now()) / 1000) + ' sn bekle.'; return; }
  if (k === 'del') { buf = buf.slice(0,-1); drawDots(); return; }
  if (buf.length >= PLEN) return;
  buf += k; drawDots();
  if (buf.length === PLEN) {
    const h = await sha(buf);
    const hit = h && PINS.find(p => p.h === h);
    if (hit) { fails = 0; unlock(hit.r); return; }
    fails++; buf = ''; drawDots();
    lmsg.textContent = h ? 'Yanlış PIN' : 'Bu tarayıcı PIN doğrulayamıyor';
    if (fails >= 5) { until = Date.now() + 30000; fails = 0; lmsg.textContent = '5 yanlış deneme. 30 sn bekle.'; }
  }
}
(function(){
  let h = '';
  ['1','2','3','4','5','6','7','8','9'].forEach(k => { h += '<button data-k="' + k + '">' + k + '</button>'; });
  h += '<span></span><button data-k="0">0</button><button class="sp" data-k="del" aria-label="Sil">⌫</button>';
  document.getElementById('pad').innerHTML = h;
})();
document.getElementById('pad').addEventListener('click', e => { const b = e.target.closest('button'); if (b) press(b.dataset.k); });
document.getElementById('lockbtn').addEventListener('click', lockNow);
document.addEventListener('visibilitychange', () => { if (document.hidden) hid = Date.now(); else { checkBackup(); if (hid && Date.now() - hid > 120000) lockNow(); } });
setInterval(checkBackup, 60000);
drawDots();
try { if (sessionStorage.getItem('cm-ok') === '1') { applyRole(sessionStorage.getItem('cm-role') || 'entry'); lockEl.classList.remove('on'); } } catch (e) {}

render();
</script>
